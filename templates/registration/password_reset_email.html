{% load static %}<!doctype html>
<html><body style="margin:0;background:#f5f7fb;padding:24px;font-family:Arial,sans-serif;color:#172033">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0"><tr><td align="center">
<table role="presentation" width="100%" style="max-width:620px;background:#fff;border:1px solid #e4e8ef;border-radius:14px;overflow:hidden" cellspacing="0" cellpadding="0">
<tr><td style="height:5px;background:{{ academy.brand_color|default:'#1458D6' }}"></td></tr>
<tr><td style="padding:28px 30px 8px">
<img src="cid:academy-logo" alt="{{ academy.name }}" style="display:block;max-width:180px;max-height:64px;object-fit:contain">
</td></tr>
<tr><td style="padding:8px 30px 30px">
<p style="margin:0 0 8px;font-size:12px;font-weight:700;color:{{ academy.brand_color|default:'#1458D6' }};text-transform:uppercase;letter-spacing:.08em">{{ academy.name }}</p>
<h1 style="margin:0 0 16px;font-size:24px;line-height:1.2">Recupera tu contraseña</h1>
<p style="font-size:15px;line-height:1.65;color:#566176">Recibimos una solicitud para restablecer la contraseña de tu cuenta en {{ academy.name }}.</p>
<p style="margin:28px 0 18px"><a href="{{ protocol }}://{{ domain }}{% url 'tenancy:academy_password_reset_confirm' academy.slug uid token %}" style="display:inline-block;background:{{ academy.brand_color|default:'#1458D6' }};color:#fff;text-decoration:none;font-weight:700;padding:12px 18px;border-radius:8px">Crear nueva contraseña</a></p>
<p style="margin:24px 0 0;padding-top:18px;border-top:1px solid #edf0f4;font-size:12px;line-height:1.55;color:#8791a3">Si no solicitaste este cambio, puedes ignorar el mensaje.</p>
</td></tr></table></td></tr></table></body></html>
